services:

  db:
    image: postgres:17

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo

    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:19
    depends_on:
      - db

    ports:
      - "8069:8069"

    volumes:
      - ./addons:/mnt/extra-addons
      - odoo-web-data:/var/lib/odoo

    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo

volumes:
  odoo-db-data:
  odoo-web-data: